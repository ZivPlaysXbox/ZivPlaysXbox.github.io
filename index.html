<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALSite Beta V13</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #1a1a1e;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #ff4a5a;
            text-align: center;
        }
        .search-box {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }
        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .input-field {
            flex: 1;
            min-width: 120px;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaaaaa;
        }
        input, select {
            background-color: #26262b;
            border: 1px solid #3f3f46;
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            height: 41px;
        }
        input:focus, select:focus {
            border-color: #ff4a5a;
        }
        .search-results {
            position: absolute;
            top: 66px;
            left: 0;
            width: 100%;
            background-color: #26262b;
            border: 1px solid #3f3f46;
            border-radius: 4px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }
        .search-item {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1e;
            gap: 15px;
        }
        .search-item:hover {
            background-color: #3f3f46;
        }
        .search-item img {
            width: 40px;
            height: 55px;
            object-fit: cover;
            border-radius: 3px;
        }
        .search-item .title-info {
            display: flex;
            flex-direction: column;
        }
        .search-item .year-info {
            font-size: 12px;
            color: #888888;
            margin-top: 2px;
        }
        .btn {
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            height: 41px;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: #ff4a5a;
        }
        .btn-primary:hover {
            background-color: #e03e4d;
        }
        .btn-secondary {
            background-color: #3f3f46;
            margin-top: 15px;
            width: 100%;
            display: none;
        }
        .btn-secondary:hover {
            background-color: #52525b;
        }
        /* Visual box linking to video stream launcher */
        .stream-card {
            width: 100%;
            padding: 40px 20px;
            background-color: #000;
            border-radius: 6px;
            border: 1px solid #26262b;
            text-align: center;
            display: none;
            box-sizing: border-box;
        }
        .stream-link {
            font-size: 20px;
            color: #ff4a5a;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #ff4a5a;
            padding: 12px 24px;
            border-radius: 4px;
            display: inline-block;
            transition: all 0.2s;
        }
        .stream-link:hover {
            background-color: #ff4a5a;
            color: #fff;
        }
        .placeholder {
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #3f3f46;
            border-radius: 6px;
            color: #666666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MALSite</h1>
    
    <div class="search-box">
        <label for="animeSearch">Search Anime Title</label>
        <input type="text" id="animeSearch" placeholder="Type anime name (e.g., Naruto, One Piece)..." oninput="searchAnime(this.value)">
        <div id="searchResults" class="search-results"></div>
    </div>

    <div class="form-group">
        <div class="input-field">
            <label for="malId">MAL ID</label>
            <input type="number" id="malId" placeholder="e.g., 21" min="1" required>
        </div>
        <div class="input-field">
            <label for="episode">Episode</label>
            <input type="number" id="episode" value="1" min="1" required>
        </div>
        <div class="input-field">
            <label for="language">Format</label>
            <select id="language">
                <option value="sub" selected>Subbed</option>
                <option value="dub">Dubbed</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="loadVideo()">Generate Link</button>
    </div>

    <div id="videoPlaceholder" class="placeholder">
        Search an anime or enter data manually to generate your stream link
    </div>

    <!-- FIXED: Bypassed frame injection entirely using a direct, targetable link card -->
    <div id="videoWrapper" class="stream-card">
        <p style="margin-top:0; color:#aaa; margin-bottom: 25px;">Stream Link Generated Successfully!</p>
        <a id="videoPlayerLink" href="" target="_blank" class="stream-link">Click Here to Open Video Player &#x2197;</a>
    </div>

    <button id="nextBtn" class="btn btn-secondary" onclick="nextEpisode()">Next Episode &rarr;</button>
</div>
<script>
    let debounceTimer;

    function searchAnime(query) {
        clearTimeout(debounceTimer);
        const resultsContainer = document.getElementById('searchResults');

        if (query.trim().length < 3) {
            resultsContainer.style.display = 'none';
            return;
        }

        debounceTimer = setTimeout(() => {
            fetch('https://jikan.moe' + encodeURIComponent(query) + '&limit=5')
                .then(response => response.json())
                .then(json => {
                    const data = json.data;
                    resultsContainer.innerHTML = '';

                    if (!data || data.length === 0) {
                        resultsContainer.style.display = 'none';
                        return;
                    }

                    data.forEach(anime => {
                        const item = document.createElement('div');
                        item.className = 'search-item';
                        
                        const imageUrl = anime.images?.jpg?.small_image_url || '';
                        const title = anime.title;
                        const malId = anime.mal_id;
                        const year = anime.year ? anime.year : (anime.aired?.prop?.from?.year || 'Unknown Year');

                        item.innerHTML = '<img src="' + imageUrl + '" alt="' + title + '">' +
                                         '<div class="title-info">' +
                                         '<strong>' + title + '</strong>' +
                                         '<span class="year-info">Year: ' + year + ' | ID: ' + malId + '</span>' +
                                         '</div>';

                        item.onclick = function() {
                            document.getElementById('malId').value = parseInt(malId, 10);
                            document.getElementById('episode').value = 1;
                            document.getElementById('animeSearch').value = title;
                            resultsContainer.style.display = 'none';
                            loadVideo();
                        };

                        resultsContainer.appendChild(item);
                    });

                    resultsContainer.style.display = 'block';
                })
                .catch(err => console.error('Error fetching data from Jikan API:', err));
        }, 500);
    }

    document.addEventListener('click', function(e) {
        const FluxContainer = document.getElementById('searchResults');
        const searchInput = document.getElementById('animeSearch');
        if (e.target !== FluxContainer && e.target !== searchInput) {
            FluxContainer.style.display = 'none';
        }
    });

    function loadVideo() {
        const malId = document.getElementById('malId').value.toString().trim();
        const episode = document.getElementById('episode').value.toString().trim();
        const language = document.getElementById('language').value;
        
        const playerLink = document.getElementById('videoPlayerLink');
        const wrapper = document.getElementById('videoWrapper');
        const placeholder = document.getElementById('videoPlaceholder');
        const nextBtn = document.getElementById('nextBtn');

        if (!malId || !episode) {
            alert('Please fill out both the MAL ID and Episode fields.');
            return;
        }

        // Fixed string concatenation forces proper backslashes
        const s = "/";
        const streamUrl = 'https:' + s + s + 'megaplay.buzz' + s + 'stream' + s + 'mal' + s + malId + s + episode + s + language;
        
        // FIXED: Applies string directly as a true browser link to destroy local file sandbox errors
        playerLink.href = streamUrl;

        placeholder.style.display = 'none';
        wrapper.style.display = 'block';
        nextBtn.style.display = 'block';
    }

    function nextEpisode() {
        const episodeInput = document.getElementById('episode');
        let currentEpisode = parseInt(episodeInput.value, 10);

        if (isNaN(currentEpisode)) {
            currentEpisode = 0;
        }

        episodeInput.value = currentEpisode + 1;
        loadVideo();
    }
</script>

</body>
</html>
